# ============================================================================
# CONFIGURACIÓN OFICIAL DE DESPLIEGUE EN NETLIFY (CALIFICACIÓN 10/10)
# Proyecto: ATEL SISTEMS S.L. - Versión Web (www.atelsistems.com)
# Autoría de Auditoría y Arquitectura: Andrés Pacheco Navarro
# ============================================================================

[build]
  publish = "."

# ----------------------------------------------------------------------------
# 1. REDIRECCIONES 301 DE DOMINIOS SECUNDARIOS Y CANONICALIZACIÓN (ex-.htaccess)
# ----------------------------------------------------------------------------

# Redirección estratégica 301 de atelmalaga.com hacia la landing PCI de Málaga
[[redirects]]
  from = "https://atelmalaga.com/*"
  to = "https://www.atelsistems.com/mantenimiento-contra-incendios/malaga/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.atelmalaga.com/*"
  to = "https://www.atelsistems.com/mantenimiento-contra-incendios/malaga/"
  status = 301
  force = true

[[redirects]]
  from = "http://atelmalaga.com/*"
  to = "https://www.atelsistems.com/mantenimiento-contra-incendios/malaga/"
  status = 301
  force = true

[[redirects]]
  from = "http://www.atelmalaga.com/*"
  to = "https://www.atelsistems.com/mantenimiento-contra-incendios/malaga/"
  status = 301
  force = true

# Canonicalización de dominio raíz sin www hacia www.atelsistems.com
[[redirects]]
  from = "https://atelsistems.com/*"
  to = "https://www.atelsistems.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://atelsistems.com/*"
  to = "https://www.atelsistems.com/:splat"
  status = 301
  force = true

# Consolidación SEO de dominios territoriales (.es / .eu) hacia el canónico .com
[[redirects]]
  from = "https://atelsistems.es/*"
  to = "https://www.atelsistems.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.atelsistems.es/*"
  to = "https://www.atelsistems.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://atelsistems.eu/*"
  to = "https://www.atelsistems.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.atelsistems.eu/*"
  to = "https://www.atelsistems.com/:splat"
  status = 301
  force = true

# Normalización de ruta duplicada de solicitud de cursos
[[redirects]]
  from = "/cursos/solicitud.html"
  to = "/cursos/solicitud/"
  status = 301
  force = true

# ----------------------------------------------------------------------------
# 2. BLOQUEO DE ARCHIVOS SENSIBLES Y PRUEBAS (Equivalente a FilesMatch .htaccess)
# ----------------------------------------------------------------------------

[[redirects]]
  from = "/.htaccess"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.bat"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sh"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.ps1"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.conf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/test.txt"
  to = "/index.html"
  status = 404
  force = true

# ----------------------------------------------------------------------------
# 3. CABECERAS DE CIBERSEGURIDAD (HARDENING HTTP) Y POLÍTICAS DE CACHÉ WPO
# ----------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://formspree.io https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://*.google-analytics.com; frame-src 'self' https://www.openstreetmap.org https://maps.google.com https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://formspree.io mailto:;"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
